name: Build Windows (wPlay)

# DRAF Phase 2 — belum pernah dijalankan. File ini meniru
# .github/workflows/build-windows.yml milik iDescriptor v0.6.1,
# dipotong untuk wPlay: tanpa FluentUI, tanpa WinFsp, tanpa libheif,
# tanpa penandatanganan kode, tanpa MSI/MSIX (itu urusan Phase 3+).
# Hasilnya cuma file wplay.exe mentah sebagai artifact.
#
# Cara pakai nanti: taruh folder app/ ini sebagai repo GitHub
# (privat dulu tidak apa-apa), lalu jalankan workflow ini manual
# lewat tab Actions -> "Build Windows (wPlay)" -> Run workflow.

on:
  workflow_dispatch:

env:
  QT_VERSION: "6.9.3"
  GST_PLUGINS_GOOD_VERSION: "1.26.2"
  GST_LIBAV_VERSION: "1.28.9"
  GST_PLUGINS_BAD_VERSION: "1.28.9"
  LIBPLIST_VER: "2.7.0"

jobs:
  build-windows:
    runs-on: windows-2022
    defaults:
      run:
        shell: msys2 {0}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: "recursive"

      - name: Setup MSYS2
        uses: msys2/setup-msys2@v2
        with:
          msystem: mingw64
          release: false
          update: false

      # CATATAN Phase 3: langkah "Use msys2 archive" milik upstream
      # SENGAJA dibuang — script util/get-msys2-archive.ps1 tidak ada
      # di repo wPlay dan langkah itu pasti gagal. Fungsinya cuma
      # mengunci versi arsip MSYS2, tidak wajib untuk build.

      # REVISI Phase 3 (run #2 gagal di sini): paket
      # mingw-w64-x86_64-gst-plugins-good/-bad/-ugly dan gst-libav
      # SUDAH TIDAK ADA di repo MSYS2 mingw64 (per Nov 2026 cuma
      # tersedia untuk ucrt64/clang64) -> "target not found".
      # Keempatnya dibuang dari daftar pacman: untuk COMPILE cukup
      # gstreamer + gst-plugins-base (masih ada di mingw64), dan
      # qml6glsink memang dibangun dari source di langkah tersendiri.
      # CATATAN runtime: plugin decoder (avdec_h264 dari gst-libav
      # dkk) masih dibutuhkan saat tes mirror nanti — itu diurus
      # di tahap bundel/test, bukan di build pertama ini.
      # REVISI Phase 3 (run #4): tambah mingw-w64-x86_64-ffmpeg —
      # CMake-nya wPlay mewajibkan libavformat/libavcodec/libavutil/
      # libswscale (semua dari FFmpeg). Di workflow upstream paket
      # ini datang diam-diam sebagai dependensi gst-libav; begitu
      # gst-libav dibuang, FFmpeg-nya ikut hilang dan Build mati
      # dengan "libavformat not found". Paket ffmpeg masih ada di
      # mingw64 (terverifikasi di packages.msys2.org).
      - name: Install deps using pacman
        run: |
          pacman -S --needed --noconfirm \
          coreutils \
          base-devel \
          git \
          make \
          libtool \
          autoconf \
          automake-wrapper \
          p7zip \
          mingw-w64-x86_64-gcc \
          mingw-w64-x86_64-cmake \
          mingw-w64-x86_64-meson \
          mingw-w64-x86_64-ninja \
          mingw-w64-x86_64-pkgconf \
          mingw-w64-x86_64-curl \
          mingw-w64-x86_64-openssl \
          mingw-w64-x86_64-libzip \
          mingw-w64-x86_64-gstreamer \
          mingw-w64-x86_64-gst-plugins-base \
          mingw-w64-x86_64-libjpeg-turbo \
          mingw-w64-x86_64-ffmpeg \
          mingw-w64-x86_64-libarchive \
          mingw-w64-x86_64-rustup \
          mingw-w64-x86_64-clang

      - name: Setup rust toolchain
        run: |
          rustup toolchain install stable-x86_64-pc-windows-gnu
          rustup default stable-x86_64-pc-windows-gnu
          rustup toolchain list

      - name: Install Qt
        uses: jurplel/install-qt-action@v3
        with:
          version: ${{ env.QT_VERSION }}
          # iDescriptor memasang banyak modul tambahan (multimedia,
          # location, serialport, 5compat, ...). wPlay cuma butuh
          # modul bawaan Qt Quick/Controls2, jadi daftarnya kosong.
          # REVISI Phase 3 (run #3): tambah qtshadertools — tanpa ini
          # program `qsb` tidak ada dan langkah build qml6glsink mati
          # dengan "Program 'qsb-qt6 qsb' not found or not executable".
          modules: qtshadertools
          arch: win64_mingw

      - name: Set Environment Variables
        run: |
          qt_root_dir="$(cygpath -au "${Qt6_DIR:?Qt6_DIR is not set}")"
          echo "QMAKE=${qt_root_dir}/bin/qmake.exe" >> "$GITHUB_ENV"
          echo "PKG_CONFIG_EXECUTABLE=C:/msys64/mingw64/bin/pkg-config.exe" >> $GITHUB_ENV

      # Selain qml6glsink, dari gst-plugins-good juga dibangun plugin
      # kecil yang dipakai pipeline UxPlay (daftar elemennya dibaca
      # langsung dari source renderers UxPlay):
      # - level: pipeline audio "... ! volume ! level ! autoaudiosink"
      #   — ketiadaannya bikin app MATI TOTAL saat start dengan
      #   g_error "gst_parse_launch error (audio 1): no element
      #   \"level\"" -> abort 0x40000015 di libglib (kejadian di PC
      #   user, 22 Nov 2026, tertangkap berkat build konsol diagnosis)
      # - autodetect: elemen autoaudiosink (audiosink bawaan UxPlay)
      # - directsound: keluaran audio Windows yang dipilih
      #   autoaudiosink
      # - jpeg + imagefreeze: pipeline video tipe JPEG
      - name: Build gst-plugins-good parts (qml6glsink + plugin UxPlay)
        run: |
          qt_root_dir="$(cygpath -au "${Qt6_DIR:?Qt6_DIR is not set}")"

          curl --retry 3 --retry-delay 5 -L \
            -o "gst-plugins-good-${GST_PLUGINS_GOOD_VERSION}.tar.xz" \
            "https://gstreamer.freedesktop.org/src/gst-plugins-good/gst-plugins-good-${GST_PLUGINS_GOOD_VERSION}.tar.xz"
          tar -xf "gst-plugins-good-${GST_PLUGINS_GOOD_VERSION}.tar.xz"
          cd "gst-plugins-good-${GST_PLUGINS_GOOD_VERSION}"

          meson setup build-qml6 . \
            --prefix=/mingw64 \
            --libdir=lib \
            --auto-features=disabled \
            -Dqt-method=qmake \
            -Dqt6=enabled \
            -Dqt5=disabled \
            -Dlevel=enabled \
            -Dautodetect=enabled \
            -Ddirectsound=enabled \
            -Djpeg=enabled \
            -Dimagefreeze=enabled \
            -Dtests=disabled \
            -Dexamples=disabled \
            -Dnls=disabled

          ninja -C build-qml6
          cp build-qml6/ext/qt6/libgstqml6.dll /mingw64/lib/gstreamer-1.0/
          cp build-qml6/gst/level/libgstlevel.dll /mingw64/lib/gstreamer-1.0/
          cp build-qml6/gst/autodetect/libgstautodetect.dll /mingw64/lib/gstreamer-1.0/
          cp build-qml6/sys/directsound/libgstdirectsound.dll /mingw64/lib/gstreamer-1.0/
          cp build-qml6/ext/jpeg/libgstjpeg.dll /mingw64/lib/gstreamer-1.0/
          cp build-qml6/gst/imagefreeze/libgstimagefreeze.dll /mingw64/lib/gstreamer-1.0/

      # Phase 3 (temuan dari build+tes Linux di sandbox): UxPlay saat
      # start MEMERIKSA plugin gst-libav — "Required gstreamer libav
      # plugin feature 'avdec_aac' not found" (dan avdec_alac) untuk
      # decode audio AirPlay. Paket pacman gst-libav sudah tidak ada
      # di mingw64, jadi plugin ini dibangun dari source resmi
      # GStreamer, meniru langkah qml6glsink di atas.
      # Versinya 1.28.9, BUKAN 1.26.2: percobaan pertama pakai 1.26.2
      # gagal compile melawan FFmpeg 8 bawaan MSYS2 sekarang
      # (AV_CODEC_ID_V308/V408/V410 sudah dihapus FFmpeg). 1.28.9
      # sekeluarga dengan GStreamer 1.28.9 yang terpasang dari pacman.
      - name: Build gst-libav from source
        run: |
          curl --retry 3 --retry-delay 5 -L \
            -o "gst-libav-${GST_LIBAV_VERSION}.tar.xz" \
            "https://gstreamer.freedesktop.org/src/gst-libav/gst-libav-${GST_LIBAV_VERSION}.tar.xz"
          tar -xf "gst-libav-${GST_LIBAV_VERSION}.tar.xz"
          cd "gst-libav-${GST_LIBAV_VERSION}"

          meson setup build-libav . \
            --prefix=/mingw64 \
            --libdir=lib

          ninja -C build-libav
          cp build-libav/ext/libav/libgstlibav.dll /mingw64/lib/gstreamer-1.0/

      # Dari gst-plugins-bad, pipeline video UxPlay memakai:
      # - videoparsersbad: h264parse/h265parse (parser bawaan UxPlay)
      #   (nama opsi meson-nya di 1.28 cuma "videoparsers" — opsi
      #   "videoparsersbad" ditolak sebagai Unknown option)
      # - wasapi: wasapisink, pilihan keluaran audio modern Windows
      #   untuk autoaudiosink (upstream juga membundelnya)
      # Versi 1.28.9 supaya sekeluarga dengan GStreamer/FFmpeg yang
      # terpasang dari pacman.
      - name: Build gst-plugins-bad parts (videoparsersbad + wasapi)
        run: |
          curl --retry 3 --retry-delay 5 -L \
            -o "gst-plugins-bad-${GST_PLUGINS_BAD_VERSION}.tar.xz" \
            "https://gstreamer.freedesktop.org/src/gst-plugins-bad/gst-plugins-bad-${GST_PLUGINS_BAD_VERSION}.tar.xz"
          tar -xf "gst-plugins-bad-${GST_PLUGINS_BAD_VERSION}.tar.xz"
          cd "gst-plugins-bad-${GST_PLUGINS_BAD_VERSION}"

          meson setup build-bad . \
            --prefix=/mingw64 \
            --libdir=lib \
            --auto-features=disabled \
            -Dvideoparsers=enabled \
            -Dwasapi=enabled \
            -Dtests=disabled \
            -Dexamples=disabled \
            -Dnls=disabled

          ninja -C build-bad
          cp build-bad/gst/videoparsers/libgstvideoparsersbad.dll /mingw64/lib/gstreamer-1.0/
          cp build-bad/sys/wasapi/libgstwasapi.dll /mingw64/lib/gstreamer-1.0/
          # libgstvideoparsersbad bergantung pada library pendamping
          # libgstcodecparsers dari build yang sama. Library itu tidak
          # ada di /mingw64/bin (gst-plugins-bad tidak dipasang via
          # pacman), jadi tanpa baris ini plugin-nya GAGAL DIMUAT di
          # PC user ("Failed to load plugin libgstvideoparsersbad.dll:
          # The specified module could not be found" -> "no element
          # h264parse" -> video renderer mati). Taruh di /mingw64/bin
          # supaya langkah bundel (ldd) ikut menyalinnya ke dist/.
          cp build-bad/gst-libs/gst/codecparsers/libgstcodecparsers-1.0-0.dll /mingw64/bin/

      - name: Download and Extract Bonjour SDK
        run: |
          curl --retry 3 --retry-delay 5 -L \
            -o bonjour-sdk.exe \
            "https://github.com/tempx-x/bonjour-sdk/raw/refs/heads/main/bonjoursdksetup.exe"

          EXPECTED_HASH="4ff2aae8205aec31b06743782cfcadce"
          ACTUAL_HASH=$(md5sum bonjour-sdk.exe | awk '{print $1}')

          echo "Expected MD5: $EXPECTED_HASH"
          echo "Actual MD5:   $ACTUAL_HASH"

          if [ "$ACTUAL_HASH" != "$EXPECTED_HASH" ]; then
            echo "::error::Checksum mismatch!"
            exit 1
          fi

          echo "Checksum verified. Extracting installer..."
          7z x bonjour-sdk.exe -oBonjourInstaller

      - name: Install Bonjour Runtime
        shell: powershell
        run: |
          $currentPath = Get-Location
          $msiFilePath = Join-Path -Path $currentPath -ChildPath "BonjourInstaller\Bonjour64.msi"
          $msiexecArguments = "/i `"$msiFilePath`" /qn"
          Write-Host "Installing Bonjour Runtime..."
          Start-Process msiexec -ArgumentList $msiexecArguments -NoNewWindow -Wait

      - name: Install Bonjour SDK
        shell: powershell
        run: |
          $currentPath = Get-Location
          $msiFilePath = Join-Path -Path $currentPath -ChildPath "BonjourInstaller\BonjourSDK64.msi"
          $msiexecArguments = "/i `"$msiFilePath`" /qn"
          Write-Host "Installing Bonjour SDK..."
          Start-Process msiexec -ArgumentList $msiexecArguments -NoNewWindow -Wait

          "BONJOUR_SDK=C:/Program Files/Bonjour SDK" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Build libplist
        run: |
          workspace="$PWD"
          tmp="$PWD/_tmp_libs"
          mkdir -p "$tmp"
          cd "$tmp"

          base_url="https://github.com/libimobiledevice"

          libs=( "libplist" )

          for name in "${libs[@]}"; do
            ver_var=$(echo "${name^^}_VER" | sed 's/-/_/g')
            ver="${!ver_var:-}"
            if [ -z "$ver" ]; then
              echo "Version for $name not set (env var $ver_var)"
              exit 1
            fi

            archive="${name}-${ver}.tar.bz2"
            url="${base_url}/${name}/releases/download/${ver}/${archive}"
            echo "=== Processing $name $ver ==="
            echo "URL: $url"
            curl --retry 3 --retry-delay 5 -L -o "$archive" "$url"

            echo "Extracting $archive"
            tar xjf "$archive"

            srcdir="${name}-${ver}"
            pushd "$srcdir"

            ./configure --without-cython
            make -j"$(nproc)"
            make install
            popd
            echo "Installed $name $ver"
          done

          cd "$workspace"
          rm -rf "$tmp"

      - name: Fetch UxPlay (in case submodules were not checked out)
        run: |
          bash scripts/fetch-uxplay.sh

      - name: Build
        run: |
          RUSTFLAGS="" cargo build --release

      # Phase 3 (setelah build pertama HIJAU di run #7): bundel paket
      # portabel. Meniru pola packaging/windows/portable/deploy.sh
      # upstream, disesuaikan dengan isi MSYS2 mingw64 kita:
      # - windeployqt6 menyalin runtime Qt + modul QML ke dist/
      # - plugin GStreamer disalin ke dist/gstreamer-1.0 (folder yang
      #   memang dicari main.rs wPlay di build rilis Windows).
      #   Daftarnya hanya plugin core+base+qml6 yang TERSEDIA di
      #   mingw64 kita; plugin good/bad/libav tidak ada di repo
      #   mingw64 lagi, jadi yang tidak ketemu dilewati dengan pesan,
      #   bukan menggagalkan build.
      # - sisa DLL (FFmpeg, GStreamer, glib, OpenSSL, libplist, ...)
      #   dikumpulkan otomatis dari hasil `ldd` atas exe + plugin,
      #   supaya tidak perlu daftar nama DLL manual yang cepat basi.
      - name: Bundle portable package
        run: |
          qt_bin="$(cygpath -au "${Qt6_DIR:?Qt6_DIR is not set}")/bin"
          rm -rf dist
          mkdir -p dist/gstreamer-1.0
          cp target/release/wplay.exe dist/

          "$qt_bin/windeployqt6.exe" --qmldir src/ui --dir dist --plugindir dist/plugins dist/wplay.exe

          PLUGINS="libgstcoreelements libgstapp libgstqml6 libgstlibav libgstlevel libgstautodetect libgstdirectsound libgstjpeg libgstimagefreeze libgstvideoparsersbad libgstwasapi libgstopengl libgstvideoconvert libgstvideoconvertscale libgstplayback libgsttypefindfunctions libgstaudioconvert libgstaudioresample libgstvolume libgstgio libgstvideorate libgstoverlaycomposition"
          for p in $PLUGINS; do
            f=$(ls /mingw64/lib/gstreamer-1.0/${p}*.dll 2>/dev/null | head -n1 || true)
            if [ -n "$f" ]; then
              echo "plugin: $f"
              cp "$f" dist/gstreamer-1.0/
            else
              echo "plugin not present, skipped: $p"
            fi
          done

          for f in dist/wplay.exe dist/gstreamer-1.0/*.dll; do
            ldd "$f" 2>/dev/null | grep -oE '/mingw64/bin/[^ ]+\.dll' || true
          done | sort -u | while read -r d; do cp "$d" dist/; done

          echo "=== dist contents ==="
          ls -la dist dist/gstreamer-1.0

      - name: Upload wplay portable artifact
        uses: actions/upload-artifact@v4
        with:
          name: wplay-windows-x86_64
          path: dist
          if-no-files-found: error
