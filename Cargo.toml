[package]
name = "wplay"
version = "0.1.0"
license = "AGPL-3.0-or-later"
edition = "2024"
description = "wPlay — standalone AirPlay receiver for Windows, extracted from iDescriptor v0.6.1 (UxPlay)"

# wPlay: daftar dependensi ini adalah potongan kecil dari Cargo.toml
# iDescriptor v0.6.1. Yang dipertahankan hanya yang disentuh modul
# AirPlay: qmetaobject/qttypes/cpp (jembatan Qt), macros (QtThreading),
# log + tracing (pencatatan), once_cell (sel thread Qt).
# Dibuang: idevice, ipatool, irecovery, rusqlite, ifuse/winfsp,
# zupdater, tokio/axum/reqwest/ssh2, dan semua dependensi fitur
# iDevice lainnya.

[profile.dev]
debug = 0

[dependencies]
cpp = "0.5.11"
log = "0.4.33"
macros = { path = "lib/macros" }
once_cell = "1.21.4"
qmetaobject = { version = "0.2.10", features = ["log"] }
qttypes = { version = "0.2.12", default-features = false, features = ["required", "qtquick", "qtquickcontrols2"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[build-dependencies]
cc = "1.2.61"
cmake = "0.1.58"
cpp_build = "0.5.11"
pkg-config = "0.3.33"
